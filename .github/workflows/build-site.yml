name: Build CV and publish website

on:
  push:
    branches:
      - main
      - cv-pdf
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-yaml \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-dejavu-core \
            poppler-utils

      - name: Create PDF from YAML
        run: python3 scripts/build_cv.py

      - name: Check generated PDF
        run: |
          test -s assets/cv.pdf
          pdfinfo assets/cv.pdf

      - name: Build website with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check website and PDF
        run: |
          test -s _site/index.html
          test -s _site/assets/cv.pdf

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
